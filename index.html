<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>En Archē Greek</title>
<meta name="description" content="A free beginner's course in Septuagint and New Testament Greek, from the alphabet up, with exercises, spaced-repetition vocabulary and grammar drills.">
<meta property="og:title" content="En Archē Greek">
<meta property="og:description" content="Learn Septuagint and New Testament Greek from the first letter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%237A2A63'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23fff'%3E%CE%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a codex leaf. A fixed contents rail at left, one reading column at right.
   Greek is always set in a serif (Gentium), English in a sans (Figtree). Light = vellum and murex ink; dark = a purple codex written in gold. */
:root {
  --bg: #F5F3F6;
  --leaf: #FFFFFF;
  --wash: #EDE8EF;
  --ink: #241B27;
  --muted: #685C6D;
  --rule: #DCD4E0;
  --accent: #7A2A63;
  --on-accent: #FFFFFF;
  --accent-soft: #F3E6EF;
  --mark: #9A7322;
  --ok: #2C7650;
  --ok-soft: #E2F0E7;
  --bad: #B03A2E;
  --bad-soft: #F9E5E2;
  --f-display: "Cardo", "Gentium Book Plus", "Palatino Linotype", Palatino, "Times New Roman", serif;
  --f-greek: "Gentium Book Plus", "Gentium Plus", "Cardo", "Palatino Linotype", Palatino, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
  --rail: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1220; --leaf: #22182A; --wash: #2B2033; --ink: #EEE8F1; --muted: #AE9FB5; --rule: #3C2F45;
    --accent: #E3BE68; --on-accent: #24170A; --accent-soft: #382B20; --mark: #D6C0E3;
    --ok: #7CD3A0; --ok-soft: #1D3328; --bad: #FF9585; --bad-soft: #3D2022;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1220; --leaf: #22182A; --wash: #2B2033; --ink: #EEE8F1; --muted: #AE9FB5; --rule: #3C2F45;
  --accent: #E3BE68; --on-accent: #24170A; --accent-soft: #382B20; --mark: #D6C0E3;
  --ok: #7CD3A0; --ok-soft: #1D3328; --bad: #FF9585; --bad-soft: #3D2022;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.3em; }
small { font-size: .85em; }
.gk { font-family: var(--f-greek); font-size: 1.1em; line-height: 1; font-feature-settings: "kern"; }
h1 .gk, h2 .gk, h3 .gk, h4 .gk, .display .gk { font-family: inherit; font-size: inherit; line-height: inherit; }
.ns { display: inline-block; line-height: .95; border-top: 2px solid var(--mark); padding-top: 1px; }
.eyebrow .num, .eyebrow .gk, .tbl thead th .gk, .tbl .grp th .gk { text-transform: none; letter-spacing: 0; }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--wash); border-right: 1px solid var(--rule);
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); }
.brand .mark { font-family: var(--f-greek); font-size: 1.55rem; letter-spacing: .16em; line-height: 1; color: var(--accent); }
.brand .sub { font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group > .eyebrow { margin: 0 0 6px 10px; }
.nav-link { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.3; }
.nav-link:hover { background: var(--leaf); }
.nav-link[aria-current="page"] { background: var(--leaf); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.nav-link .num { font-family: var(--f-greek); color: var(--accent); font-size: 1.02rem; }
.nav-link .ico { color: var(--muted); display: inline-flex; }
.badge { font-size: .72rem; font-weight: 700; min-width: 1.6em; padding: 1px 6px; text-align: center; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-variant-numeric: tabular-nums; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--rule); flex: none; }
.dot.seen { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.dot.done { border-color: var(--accent); background: var(--accent); }
.rail-foot { margin-top: auto; font-size: .78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.rail-foot .s { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.rail-foot.synced .s { background: var(--ok); }

.topbar { display: none; }
main { min-width: 0; padding-block: 40px 80px; padding-left: clamp(20px, 5vw, 64px); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.page.wide { max-width: 980px; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--wash); }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--wash); border-bottom: 1px solid var(--rule); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar .brand .mark { font-size: 1.2rem; }
  .rail { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: min(320px, 86vw); height: auto; transform: translateX(-105%); transition: transform .22s ease; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(20, 10, 25, .45); }
  main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (min-width: 901px) { .scrim { display: none !important; } }

/* ---------- Buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--leaf); color: var(--ink); font-weight: 600; font-size: .95rem; text-decoration: none; cursor: pointer; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rule); }
.tab { padding: 10px 14px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--rule); background: var(--leaf); cursor: pointer; font-size: .88rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .gk { font-size: 1.05em; }
input[type="text"], input[type="search"], textarea, select { font: inherit; color: var(--ink); background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; width: 100%; }
textarea { min-height: 72px; resize: vertical; }

/* ---------- Home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 40px; align-items: center; }
.codex { container-type: inline-size; background: var(--leaf); border: 1px solid var(--rule); border-radius: 4px; padding: 28px 26px 22px; position: relative; }
.codex::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--rule); border-radius: 2px; pointer-events: none; }
.codex .lines { white-space: nowrap; font-family: var(--f-greek); font-size: clamp(.95rem, 6.4cqi, 1.9rem); letter-spacing: .1em; line-height: 1.55; color: var(--ink); position: relative; }
.codex .lines .ini { color: var(--accent); font-size: 1.5em; line-height: 0; }
.codex figcaption { margin-top: 16px; font-size: .8rem; color: var(--muted); position: relative; }
.hero-text { display: flex; flex-direction: column; gap: 16px; }
.hero h1 { font-size: clamp(2rem, 4.2vw, 2.9rem); }
.hero .lede { font-size: 1.08rem; color: var(--muted); max-width: 52ch; }
.incipits { display: grid; gap: 8px; border-left: 2px solid var(--accent); padding-left: 14px; }
.incipits p { font-size: .92rem; color: var(--muted); }
.incipits .gk { color: var(--ink); }
.progress-strip { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: .92rem; color: var(--muted); padding: 14px 18px; background: var(--wash); border-radius: var(--r); }
.progress-strip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.map-item { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 16px; background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; color: var(--ink); align-items: start; }
.map-item:hover { border-color: var(--accent); }
.map-item .num { font-family: var(--f-greek); font-size: 1.5rem; color: var(--accent); line-height: 1.1; grid-row: span 2; }
.map-item .t { font-weight: 600; line-height: 1.3; }
.map-item .b { grid-column: 2 / 4; font-size: .86rem; color: var(--muted); line-height: 1.45; }
.map-item .st { font-size: .75rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.map-item .st.done { color: var(--ok); }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.how div { display: flex; flex-direction: column; gap: 6px; }
.how h3 { font-size: 1.15rem; }
.how p { font-size: .93rem; color: var(--muted); }
.ahead { display: flex; flex-wrap: wrap; gap: 8px; }
.ahead span { font-size: .86rem; padding: 4px 10px; border: 1px dashed var(--rule); border-radius: 99px; color: var(--muted); }
.sec-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.sec-head h2 { font-size: 1.6rem; }

/* ---------- Lesson ---------- */
.l-head { display: flex; flex-direction: column; gap: 10px; }
.l-head .num { font-family: var(--f-greek); font-size: 1rem; color: var(--accent); }
.l-head h1 { font-size: clamp(2rem, 4vw, 2.6rem); }
.l-head .gk-title { font-family: var(--f-greek); font-size: 1.3rem; color: var(--muted); }
.goals { background: var(--wash); border-radius: var(--r); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.goals ul { display: grid; gap: 4px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc button { font-size: .82rem; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--rule); background: var(--leaf); cursor: pointer; }
.toc button:hover { border-color: var(--accent); }
.ls { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 80px; }
.ls > h2 { font-size: 1.55rem; }
.ls p, .ls li { max-width: 68ch; }
.ls ul, .ls ol { display: grid; gap: 6px; }
.callout { background: var(--accent-soft); border-radius: var(--r); padding: 14px 18px; font-size: .95rem; }
.callout.latin { background: var(--wash); border: 1px solid var(--rule); }
.callout b:first-child { color: var(--accent); }
.example { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.gk-line { font-family: var(--f-greek); font-size: 1.3rem; line-height: 1.45; }
.gk-line .gk { font-size: 1em; line-height: inherit; }
.gk-inline .gk { font-weight: 700; }
.gk-row { font-family: var(--f-greek); font-size: 1.5rem; letter-spacing: .12em; line-height: 1.3; color: var(--accent); }
.gk-row .gk { font-size: 1em; line-height: inherit; }
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.groups > div { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.groups h4 { font-size: 1.05rem; }
.groups p:not(.gk-row) { font-size: .88rem; color: var(--muted); }
.pair-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair-cards.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pair-cards > div { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.pair-cards p { font-size: .9rem; color: var(--muted); }
.big-gk { font-family: var(--f-greek); font-size: 2rem; line-height: 1.2; color: var(--accent); }
.big-gk .gk { font-size: 1em; line-height: inherit; }
.facts { list-style: none; padding: 0; display: grid; gap: 12px; }
.facts li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 14px; align-items: baseline; }
.facts .big-gk { font-size: 1.35rem; letter-spacing: .06em; }
.syll { display: flex; gap: 4px; }
.syll span { display: flex; flex-direction: column; align-items: center; padding: 8px 14px; background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px; }
.syll b { font-family: var(--f-greek); font-size: 1.6rem; font-weight: 400; }
.syll small { color: var(--muted); }
.steps { counter-reset: s; list-style: none; padding: 0 !important; }
/* Not a grid: inline children (<b>, Greek spans) would each become a separate grid cell */
.steps li { counter-increment: s; position: relative; padding-left: calc(1.8em + 8px); }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; font-family: var(--f-display); font-weight: 700; color: var(--accent); }

/* Tables */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--rule); border-radius: var(--r); background: var(--leaf); }
.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .93rem; background: var(--leaf); }
.tbl th, .tbl td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl thead th { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--wash); }
.tbl tbody tr:last-child td, .tbl tbody tr:last-child th { border-bottom: 0; }
.tbl th[scope="row"] { color: var(--muted); font-weight: 600; font-size: .8rem; white-space: nowrap; }
.tbl .gk-cell { font-family: var(--f-greek); font-size: 1.15rem; white-space: nowrap; }
.tbl .gk-cell .gk { font-size: 1em; }
.tbl .grp th { background: var(--wash); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.para { display: flex; flex-direction: column; gap: 6px; }
.para-title { font-size: .85rem; color: var(--muted); }
.para-title .gk { color: var(--ink); font-weight: 700; }
.para td .f { font-family: var(--f-greek); font-size: 1.18rem; white-space: nowrap; display: block; line-height: 1.35; }
.para td .f .gk { font-size: 1em; line-height: inherit; }
.para td .art { color: var(--muted); }
.para td .end { color: var(--accent); font-weight: 700; }
.para td .gl { display: block; font-size: .78rem; color: var(--muted); line-height: 1.3; }
.para.recall td .f { cursor: pointer; border-radius: 6px; }
.para.recall td:not(.shown) .f { color: transparent; background: repeating-linear-gradient(135deg, var(--wash) 0 6px, var(--bg) 6px 12px); }
.para.recall td:not(.shown) .f * { color: transparent !important; }
.para.recall td:not(.shown) .gl { visibility: hidden; }
.positions td { vertical-align: middle; }

/* Alphabet */
.alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.alpha > div { background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; align-items: center; }
.alpha .lt { font-family: var(--f-greek); font-size: 1.8rem; line-height: 1.1; grid-row: span 3; color: var(--accent); white-space: nowrap; }
.alpha .lt .gk { font-size: 1em; line-height: inherit; }
.alpha .nm { font-weight: 600; font-size: .9rem; line-height: 1.25; }
.alpha .tr { font-size: .8rem; color: var(--muted); line-height: 1.25; }
.alpha .sd { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.alpha .tr .ph { color: var(--ink); font-weight: 700; }

/* Read list */
.readlist { display: flex; flex-wrap: wrap; gap: 8px; }
.readlist.wide { flex-direction: column; }
.readlist button { text-align: left; background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.readlist button:hover { border-color: var(--accent); }
.readlist .g { font-family: var(--f-greek); font-size: 1.35rem; line-height: 1.35; }
.readlist .g .gk { font-size: 1em; line-height: inherit; }
.readlist .r { font-size: .85rem; color: var(--muted); }
.readlist button:not(.open) .r { visibility: hidden; }

/* Prepositions */
.prep-fig { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; }
.prep-fig svg { display: block; width: 100%; height: auto; max-width: 620px; margin: 0 auto; }
.prep-fig .obj { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.prep-fig .ln { stroke: var(--ink); stroke-width: 2; fill: none; }
.prep-fig .dash { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
.prep-fig .pt { fill: var(--ink); }
.prep-fig .gw { font-family: var(--f-greek); font-size: 19px; fill: var(--accent); font-weight: 700; }
.prep-fig .ew { font-family: var(--f-body); font-size: 12px; fill: var(--muted); }

/* Verses */
.verses { display: flex; flex-direction: column; gap: 16px; }
.verse { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.verse header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verse header b { font-family: var(--f-display); font-size: 1.1rem; }
.src { font-size: .68rem; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.src.NT { background: var(--accent); color: var(--on-accent); }
.v-gk { font-family: var(--f-greek); font-size: 1.45rem; line-height: 1.7; display: flex; flex-wrap: wrap; gap: 0 .32em; }
.v-gk button { border: 0; background: none; padding: 0 1px; cursor: pointer; border-bottom: 1px dotted var(--rule); font-family: inherit; font-size: inherit; line-height: inherit; border-radius: 3px; }
.v-gk button:hover { border-bottom-color: var(--accent); }
.v-gk button[aria-pressed="true"] { background: var(--accent-soft); border-bottom-color: var(--accent); }
.v-gk .gk { font-size: 1em; line-height: inherit; }
.v-gloss { min-height: 1.6em; font-size: .92rem; color: var(--muted); }
.v-gloss .gk { color: var(--ink); font-weight: 700; }
.v-en { font-style: italic; }

.vtbl .d { color: var(--muted); font-size: .85em; }

.pill.learning { background: var(--accent-soft); color: var(--ink); }

.q-bar { flex: 1; height: 4px; background: var(--wash); border-radius: 4px; overflow: hidden; }
.q-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.q-body { display: flex; flex-direction: column; gap: 14px; }
.q-prompt { font-size: 1.08rem; font-weight: 500; }
.q-prompt .big, .q-prompt .big .gk { font-family: var(--f-greek); font-size: 1.45rem; font-weight: 400; }

.fb:empty { display: none; }
.fb.ok b:first-child { color: var(--ok); }
.fb.bad b:first-child { color: var(--bad); }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Flashcards */
.flash { background: var(--leaf); border: 1px solid var(--rule); border-radius: var(--r); padding: 28px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; min-height: 300px; }

.tally { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.setpick { display: flex; flex-wrap: wrap; gap: 6px; }

.l-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 20px; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--leaf); border: 1px dashed var(--rule); border-radius: var(--r); display: flex; flex-direction: column; gap: 12px; align-items: center; }

@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; }

  .page { gap: 32px; }
}

<script>
(function () {
'use strict';
const C = window.COURSE;
const P = C.para;
const $ = (s, r) => (r || document).querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const DAY = 864e5;
// Units (C.units, ascending by first lesson)
const unitLessons = u => { const next = C.units.find(x => x.first > u.first); return C.lessons.filter(l => l.n >= u.first && (!next || l.n < next.first)); };

/* ================= Transliteration ================= */
const BASE = { 'α': 'a', 'β': 'b', 'γ': 'g', 'δ': 'd', 'ε': 'e', 'ζ': 'z', 'η': 'ē', 'θ': 'th', 'ι': 'i', 'κ': 'k', 'λ': 'l', 'μ': 'm', 'ν': 'n', 'ξ': 'x', 'ο': 'o', 'π': 'p', 'ρ': 'r', 'σ': 's', 'ς': 's', 'τ': 't', 'υ': 'y', 'φ': 'ph', 'χ': 'ch', 'ψ': 'ps', 'ω': 'ō' };

  const letters = [];

      const L = letters[letters.length - 1];
      if (L) { if (c === '̔') L.rough = true; if (c === '̈') L.diaer = true; }

    }

    if (diph) { piece = ((L.rough || N.rough) ? 'h' : '') + (L.c === 'υ' ? 'u' : BASE[L.c]) + (N.c === 'υ' ? 'u' : 'i'); i++; }
    else if (L.c === 'γ' && N && ['γ', 'κ', 'ξ', 'χ'].includes(N.c)) piece = 'n';
    else if (L.c === 'ρ' && L.rough) piece = 'rh';
    else piece = (L.rough ? 'h' : '') + BASE[L.c];
    if (L.up) piece = piece.charAt(0).toUpperCase() + piece.slice(1);
    out += piece;

}
const normLat = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/y/g, 'u').replace(/[^a-z]/g, '');
const normGk = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ');

/* ================= Greek text wrapping ================= */
const GK_RE = /[Ͱ-Ͽἀ-῿](?:[Ͱ-Ͽἀ-῿̀-ͯʹ]|[\s,.;:··’'()–-]+(?=[Ͱ-Ͽἀ-῿]))*/g;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!/[Ͱ-Ͽἀ-῿]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if (!p || p.closest('.gk, .no-gk, script, style, textarea, title, option, svg')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const s = n.nodeValue; GK_RE.lastIndex = 0;
    const frag = document.createDocumentFragment(); let m, last = 0;
    while ((m = GK_RE.exec(s))) {
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const sp = document.createElement('span'); sp.className = 'gk'; sp.lang = 'grc'; sp.textContent = m[0];
      frag.appendChild(sp); last = m.index + m[0].length;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}

/* ================= Vocabulary ids ================= */
C.vocab.forEach(w => { w.id = normLat(translit(w.g)); });

/* ================= Progress store ================= */
const LS_KEY = 'enarche-greek-v1';
const Store = {
  s: { v: 1, lessons: {}, cards: {}, last: null, t: 0 },
  mode: 'local',
  load() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) this.merge(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
  },
  merge(r) {
    if (!r || typeof r !== 'object') return;
    const s = this.s;
    Object.entries(r.lessons || {}).forEach(([k, v]) => {
      const a = s.lessons[k] || {};
      s.lessons[k] = { seen: !!(a.seen || v.seen), best: Math.max(a.best || 0, v.best || 0), done: !!(a.done || v.done) };
    });
    Object.entries(r.cards || {}).forEach(([k, v]) => { const a = s.cards[k]; if (!a || (v.l || 0) > (a.l || 0)) s.cards[k] = v; });
    if ((r.t || 0) > (s.t || 0)) { s.last = r.last || s.last; s.t = r.t; }
  },
  save() {
    this.s.t = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.s)); } catch (e) { /* ignore */ }
  }
};

const lessonState = n => Store.s.lessons[n] || {};
function markSeen(n) { const s = Store.s.lessons[n] || {}; if (!s.seen) { s.seen = true; Store.s.lessons[n] = s; } Store.s.last = 'lesson-' + n; Store.save(); }
function recordScore(n, pct) { const s = Store.s.lessons[n] || {}; s.seen = true; s.best = Math.max(s.best || 0, pct); if (pct >= 70) s.done = true; Store.s.lessons[n] = s; Store.save(); }

/* ================= SRS ================= */
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
const cardOf = id => Store.s.cards[id];
const isDue = (c, now) => c && c.b > 0 && c.d <= (now || Date.now());
function grade(id, g) {
  const now = Date.now(); const c = Object.assign({ b: 0, n: 0 }, Store.s.cards[id] || {});
  if (g === 0) { c.b = 1; c.d = now; }
  else { c.b = Math.min(6, (c.b || 0) + (g === 2 ? 2 : 1)); c.d = now + INTERVALS[c.b] * DAY - 2 * 3600e3; }
  c.n = (c.n || 0) + 1; c.l = now; Store.s.cards[id] = c; Store.save();
}
function nextLabel(id, g) {
  const c = Store.s.cards[id] || { b: 0 };
  if (g === 0) return 'again now';
  const b = Math.min(6, (c.b || 0) + (g === 2 ? 2 : 1)); const d = INTERVALS[b];
  return d === 1 ? 'in 1 day' : 'in ' + d + ' days';
}
const vocabFor = lessons => C.vocab.filter(w => lessons.includes(w.L));
function dueCount(lessons) { const now = Date.now(); return vocabFor(lessons || VOCAB_LESSONS).filter(w => isDue(cardOf(w.id), now)).length; }
const learnedCount = () => C.vocab.filter(w => (cardOf(w.id) || {}).b >= 3).length;
const masteryPill = id => { const c = cardOf(id); if (!c || !c.b) return '<span class="pill">New</span>'; if (c.b >= 3) return '<span class="pill known">Known</span>'; return '<span class="pill learning">Learning</span>'; };

/* ================= Paradigm rendering ================= */
const PN = [['1st', '2nd', '3rd'], ['Singular', 'Plural']];
function withEnd(form, len) {
  form = nfc(form);
  if (!len) return esc(form);
  const paren = form.match(/\(ν\)$/); const core = paren ? form.slice(0, -3) : form;
  const i = core.length - len;
  return esc(core.slice(0, i)) + '<span class="end">' + esc(core.slice(i)) + (paren ? '(ν)' : '') + '</span>';
}
function cell(f, gl) { return '<td><span class="f">' + f + '</span>' + (gl ? '<span class="gl">' + esc(gl) + '</span>' : '') + '</td>'; }
const verbEnds = v => v.cv ? P.cEndings[v.cv] : P.verbEndings;
const TENSE = { pres: 'Present', impf: 'Imperfect', fut: 'Future' };
// The six forms of a verb in one tense (1st–3rd sg., then pl.), each as [stem, ending]
function verbParts(v, t) {
  if (t === 'impf') return (v.cv ? P.cImpfEndings[v.cv] : P.impfEndings).map((e, i) => [v.impf[i === 3 || i === 4 ? 1 : 0], e]);
  if (t === 'fut') return (v.fcv ? P.cEndings[v.fcv] : P.verbEndings).map(e => [v.fut, e]);
  return verbEnds(v).map(e => [v.stem, e]);
}
const verbForms = (v, t) => verbParts(v, t).map(x => x[0] + x[1]);
const SUBJ = [['I', 'you', 'he/she/it'], ['we', 'you (pl.)', 'they']];
function verbGloss(v, t, n, p) {
  const s = SUBJ[n][p];
  if (t === 'impf') return s + (n === 0 && p !== 1 ? ' was ' : ' were ') + v.ing;
  if (t === 'fut') return s + ' will ' + v.en;
  return s + ' ' + (n === 0 && p === 2 ? v.en3 : v.en);
}
const formCell = x => esc(x[0]) + '<span class="end">' + esc(x[1]) + '</span>';
function verbTable(v, gloss, t) {
  t = t || 'pres';
  const parts = verbParts(v, t);
  let rows = '';
  for (let p = 0; p < 3; p++) {
    rows += '<tr><th scope="row">' + PN[0][p] + '</th>';
    for (let n = 0; n < 2; n++) rows += cell(formCell(parts[n * 3 + p]), gloss ? verbGloss(v, t, n, p) : '');
    rows += '</tr>';
  }
  return '<div class="para"><div class="para-title">' + TENSE[t] + ' active indicative of <b>' + esc(v.lemma) + '</b>, “I ' + esc(v.en) + '”</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
// Contract verbs side by side; with steps, each cell also shows the vowels that merged (ε + ομεν)
function cverbsTable(keys, steps, t) {
  t = t || 'pres';
  const vs = keys.map(k => P.cverbs[k]);
  const base = t === 'impf' ? P.impfEndings : P.verbEndings;
  let rows = '';
  [0, 1].forEach(n => {
    rows += '<tr class="grp"><th colspan="' + (vs.length + 1) + '">' + PN[1][n] + '</th></tr>';
    for (let p = 0; p < 3; p++) {
      const i = n * 3 + p;
      rows += '<tr><th scope="row">' + PN[0][p] + '</th>' + vs.map(v => cell(formCell(verbParts(v, t)[i]), steps ? v.cv + ' + ' + base[i].replace('(ν)', '') : '')).join('') + '</tr>';
    }
  });
  return '<div class="para"><div class="para-title">' + TENSE[t] + ' active indicative of contract verbs</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th>' + vs.map(v => '<th>' + esc(v.lemma) + ' · ' + esc(v.en) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
// One verb in all three tenses, side by side
function tensesTable(v, gloss) {
  const ts = ['pres', 'impf', 'fut'];
  let rows = '';
  [0, 1].forEach(n => {
    rows += '<tr class="grp"><th colspan="4">' + PN[1][n] + '</th></tr>';
    for (let p = 0; p < 3; p++) rows += '<tr><th scope="row">' + PN[0][p] + '</th>' + ts.map(t => cell(formCell(verbParts(v, t)[n * 3 + p]), gloss ? verbGloss(v, t, n, p) : '')).join('') + '</tr>';
  });
  return '<div class="para"><div class="para-title"><b>' + esc(v.lemma) + '</b> in three tenses</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th>' + ts.map(t => '<th>' + TENSE[t] + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
function eimiTable(t) {
  const src = t ? P.eimi[t] : P.eimi;
  const title = { pres: 'Present indicative of <b>εἰμί</b>, “I am”', impf: 'Imperfect of <b>εἰμί</b>, “I was”', fut: 'Future of <b>εἰμί</b>, “I will be”' }[t || 'pres'];
  let rows = '';
  for (let p = 0; p < 3; p++) rows += '<tr><th scope="row">' + PN[0][p] + '</th>' + cell(esc(src.sg[p]), src.en[0][p]) + cell(esc(src.pl[p]), src.en[1][p]) + '</tr>';
  return '<div class="para"><div class="para-title">' + title + '</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
function nounGloss(n, num, c) {
  if (!n.en) return '';
  const w = num === 'sg' ? n.en : n.enPl;
  return ['the ' + w, 'of the ' + w, 'to/for the ' + w, 'the ' + w + ' (object)'][c];
}
const endsOf = n => n.E || P.endLen[n.cls];
function nounTable(key, art, gloss) {
  const n = P.nouns[key]; const E = endsOf(n);
  const ar = g => P.article[n.g];
  let rows = '';
  for (let c = 0; c < 4; c++) {
    rows += '<tr><th scope="row">' + P.cases[c] + '</th>';
    ['sg', 'pl'].forEach(num => {
      if (!n[num]) { rows += '<td class="muted">—</td>'; return; }
      const a = art ? '<span class="art">' + esc(ar()[num][c]) + '</span> ' : '';
      rows += cell(a + withEnd(n[num][c], E[num][c]), gloss ? nounGloss(n, num, c) : '');
    });
    rows += '</tr>';
  }
  const art0 = P.article[n.g].sg[0];
  return '<div class="para"><div class="para-title"><b>' + esc(n.lemma) + ', ' + esc(dictGen(n)) + ', ' + esc(art0) + '</b>, “' + esc(n.gloss) + '”</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
function dictGen(n) { if (n.dict) return n.dict; const g = nfc(n.sg[1]); const E = endsOf(n).sg[1]; return '-' + g.slice(g.length - E); }
function nounsTable(keys, art) {
  const ns = keys.map(k => P.nouns[k]);
  let head = '<tr><th></th>' + ns.map(n => '<th>' + esc(n.lemma) + ' · ' + esc(n.gloss) + '</th>').join('') + '</tr>';
  let rows = '';
  ['sg', 'pl'].forEach(num => {
    rows += '<tr class="grp"><th colspan="' + (ns.length + 1) + '">' + (num === 'sg' ? 'Singular' : 'Plural') + '</th></tr>';
    for (let c = 0; c < 4; c++) {

function renderMC(body, it, done) {
  const order = shuffle(it.o.map((_, i) => i));
  body.innerHTML = '<div class="q-prompt">' + it.q + '</div><div class="opts">' + order.map((i, k) => '<button type="button" class="opt" data-i="' + i + '"><span class="muted">' + (k + 1) + '</span>&ensp;' + esc(it.o[i]) + '</button>').join('') + '</div><div class="fb" aria-live="polite"></div><div class="q-actions"></div>';
  let answered = false;
  const choose = btn => {
    if (answered) return; answered = true;
    const i = +btn.dataset.i, ok = i === it.a;
    $$('.opt', body).forEach(b => { b.disabled = true; if (+b.dataset.i === it.a) b.classList.add('ok'); });
    if (!ok) btn.classList.add('bad');
    const fb = $('.fb', body); fb.className = 'fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> The answer is <b>' + esc(it.o[it.a]) + '</b>. ') + (it.x ? esc(it.x) : '');
    greekify(fb);
    done(ok ? 1 : 0);
  };
  body.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) choose(b); });
  body._key = e => { const k = parseInt(e.key, 10); if (k >= 1 && k <= order.length) { const b = $$('.opt', body)[k - 1]; if (b) choose(b); return true; } return false; };
}
function renderType(body, it, done) {
  const answers = [].concat(it.a || translit(it.gk));

    '<div class="row"><input type="text" id="q-type-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in English letters" aria-label="Your transliteration" style="flex:1;min-width:0"><button type="button" class="btn primary" data-act="check">Check</button></div><div class="fb" aria-live="polite"></div><div class="q-actions"></div>';
  const inp = $('input', body); let answered = false;
  const check = () => {

    fb.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + 'Standard transliteration: <b>' + esc(answers[0]) + '</b>.' + (it.x ? ' ' + esc(it.x) : '');

function renderMatch(body, it, done) {

  body.innerHTML = '<div class="q-prompt">' + esc(it.q) + '</div><div class="match"><div class="col">' + left.map(i => '<button type="button" data-l="' + i + '" aria-pressed="false">' + esc(it.pairs[i][0]) + '</button>').join('') + '</div><div class="col">' + right.map(i => '<button type="button" data-r="' + i + '">' + esc(it.pairs[i][1]) + '</button>').join('') + '</div></div><div class="fb" aria-live="polite"></div><div class="q-actions"></div>';
  let sel = null, mistakes = 0, matched = 0;

function runQuiz(host, items, opts) {
  opts = opts || {};
  let idx = 0, score = 0;
  const total = items.length;
  host.innerHTML = '<div class="quiz"><div class="q-top"><span class="q-count"></span><div class="q-bar"><i></i></div></div><div class="q-body"></div></div>';
  const body = $('.q-body', host);
  function show() {
    if (idx >= total) return finish();
    const it = items[idx];
    $('.q-count', host).textContent = (idx + 1) + ' / ' + total;
    $('.q-bar i', host).style.width = (idx / total * 100) + '%';
    const fresh = bodyRef.cloneNode(false); bodyRef.replaceWith(fresh); bodyRef = fresh;
    RENDER[it.t](fresh, it, pts => { score += pts; next(fresh); });
    greekify(fresh);
    activeKey = e => {
      if (e.key === 'Enter' || e.key === 'ArrowRight') { const nb = $('[data-act="next"]', fresh); if (nb) { nb.click(); return true; } }
      return fresh._key ? fresh._key(e) : false;
    };
  }
  let bodyRef = body;
  function next(b) {
    const acts = $('.q-actions', b) || b;
    const nb = document.createElement('button'); nb.type = 'button'; nb.className = 'btn primary'; nb.dataset.act = 'next';
    nb.textContent = idx + 1 < total ? 'Next' : 'See results';
    nb.addEventListener('click', () => { idx++; show(); });
    acts.appendChild(nb); nb.focus({ preventScroll: true });
  }
  function finish() {
    activeKey = null;
    const pct = Math.round(score / total * 100);
    $('.q-count', host).textContent = 'Finished';
    $('.q-bar i', host).style.width = '100%';
    const msg = opts.message ? opts.message(pct) : (pct >= 90 ? 'Excellent work.' : pct >= 70 ? 'Good work.' : 'Worth another pass.');
    bodyRef.innerHTML = '<div class="result"><div class="score">' + pct + '%</div><p>' + esc(msg) + ' You scored ' + (Math.round(score * 10) / 10) + ' of ' + total + '.</p><div class="q-actions"><button type="button" class="btn" data-act="again">Try again</button>' + (opts.extra || '') + '</div></div>';
    $('[data-act="again"]', bodyRef).addEventListener('click', () => { const again = opts.reshuffle ? opts.reshuffle() : items; runQuiz(host, again, opts); });
    if (opts.onDone) opts.onDone(pct);
  }
  show();
}

/* ---------- Grammar review ---------- */
const SETS = [
  ['verbs', 'Present verbs', 4], ['eimi', 'εἰμί', 10], ['article', 'Article', 7], ['n2', '2nd declension', 6],
  ['n1', '1st declension', 7], ['adj', 'Adjectives', 8], ['pron', 'Pronouns', 10], ['n3', '3rd declension', 11],
  ['cverbs', 'Contract verbs', 12], ['tenses', 'Imperfect & future', 13]
];
const CASES = ['nom', 'gen', 'dat', 'acc'], CASE_LONG = { nom: 'nominative', gen: 'genitive', dat: 'dative', acc: 'accusative' };
const G_LONG = { m: 'masculine', f: 'feminine', n: 'neuter' }, N_LONG = { sg: 'singular', pl: 'plural' }, PER_LONG = { 1: '1st person', 2: '2nd person', 3: '3rd person' };
const T_LONG = { pres: 'present', impf: 'imperfect', fut: 'future' };
function defaultSets() { const reached = Math.max(4, ...C.lessons.filter(l => lessonState(l.n).seen).map(l => l.n), 0); const s = SETS.filter(x => x[2] <= reached).map(x => x[0]); return s.length ? s : ['verbs']; }

function buildPool(sets) {
  const out = []; // {form, lemma, gloss, kind:'pn'|'tpn'|'cn'|'cng', parses:[]}
  const group = (lemma, gloss, kind, entries) => {
    const m = new Map();
    entries.forEach(([form, parse]) => { form = nfc(form); if (!m.has(form)) m.set(form, []); m.get(form).push(parse); });
    m.forEach((parses, form) => out.push({ form, lemma, gloss, kind, parses }));
  };
  if (sets.includes('verbs')) Object.values(P.verbs).forEach(v => {
    const e = [];
    P.verbEndings.forEach((end, i) => e.push([v.stem + end.replace('(ν)', 'ν'), { p: (i % 3) + 1, n: i < 3 ? 'sg' : 'pl' }]));
    group(v.lemma, v.en, 'pn', e);
  });
  if (sets.includes('cverbs')) Object.values(P.cverbs).forEach(v => {
    const e = [];
    P.cEndings[v.cv].forEach((end, i) => e.push([v.stem + end.replace('(ν)', 'ν'), { p: (i % 3) + 1, n: i < 3 ? 'sg' : 'pl' }]));
    group(v.lemma, v.en, 'pn', e);
  });
  if (sets.includes('eimi')) {
    const e = [];
    P.eimi.sg.forEach((f, i) => e.push([f.replace('(ν)', 'ν'), { p: i + 1, n: 'sg' }]));
    P.eimi.pl.forEach((f, i) => e.push([f.replace('(ν)', 'ν'), { p: i + 1, n: 'pl' }]));

  $$('.readlist', root).forEach(rl => rl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const o = b.classList.toggle('open'); b.setAttribute('aria-expanded', String(o)); }));
}
window.addEventListener('hashchange', () => route());

Store.load();
route(true);
})();
</script>
